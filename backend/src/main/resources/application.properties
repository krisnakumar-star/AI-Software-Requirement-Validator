
# ==========================================
# APPLICATION CONFIGURATION
# ==========================================
spring.application.name=backend
server.port=8080

# ==========================================
# MONGODB CONFIGURATION
# ==========================================
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/requirement_validator}

# ==========================================
# FILE UPLOAD CONFIGURATION
# ==========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ==========================================
# JWT AUTHENTICATION
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# ==========================================
# CLOUD AI SERVICE CONFIGURATION
# ==========================================
# Local FastAPI service runs on port 8001.
# Change this URL when deploying FastAPI to the cloud.
llm.api.url=${LLM_API_URL:http://localhost:8001}

# Must match SRS_API_KEY in ai-service/.env
llm.api.key=${LLM_API_KEY}

# ==========================================
# LLM CONNECTION TIMEOUTS
# ==========================================
llm.api.connect-timeout=${LLM_API_CONNECT_TIMEOUT:10000}
llm.api.read-timeout=${LLM_API_READ_TIMEOUT:120000}
